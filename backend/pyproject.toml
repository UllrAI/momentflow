[project]
name = "momentflow-local"
version = "0.1.0"
description = "Local photo/video face clustering and personal highlight pipeline"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "opencv-python-headless>=4.10,<5", "numpy>=2,<3", "pillow>=11,<13"]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "httpx2>=2.16.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
